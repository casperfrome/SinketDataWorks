spring.application.name=sinket-dataworks
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/fake_dataworks_260927?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
studio.migration.baseline-existing=${STUDIO_BASELINE_EXISTING:false}
studio.datasource.encryption-key=${STUDIO_ENCRYPTION_KEY:}
studio.mysql.workers=4
studio.mysql.queue-size=32
spring.sql.init.encoding=UTF-8
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
studio.storage-path=${STUDIO_STORAGE_PATH:./storage}
studio.simulation.queue-ms=1200
studio.simulation.run-ms=2500
server.error.include-message=never

# Manual workflow limits; queries share the existing bounded MySQL executor.
studio.workflow.max-nodes=100
studio.workflow.max-active=8

# Dunnelean control plane, restricted to loopback; data streams bypass the Java service.
studio.sync.service-url=${DUNNELEAN_URL:http://127.0.0.1:9876}

# Realtime SQL Gateway control uses a durable metadata ledger and reconciles after restart.
studio.realtime.polling-enabled=${REALTIME_POLLING_ENABLED:true}
studio.flink.gateway-url=${FLINK_GATEWAY_URL:http://127.0.0.1:8083}
studio.flink.jobmanager-url=${FLINK_REST_URL:http://127.0.0.1:8081}
